<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Hub — Admin</title>
<style>
  :root{ --bg:#161826; --surface:#232532; --surface-2:#2b2d3c; --text:#e9e9ed; --accent:#9184d9;
         --accent-300:#b5abfc; --line:rgba(233,233,237,0.12); --muted:rgba(233,233,237,0.55); --radius:10px; }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; font-size:15px;}
  .hide{display:none !important;}
  .wrap{max-width:900px; margin:0 auto; padding:32px 20px 80px;}
  h1{font-size:1.4rem; margin:0 0 4px;}
  h2{font-size:1.05rem; margin:0 0 14px;}
  a{color:var(--accent-300);}
  .card{background:var(--surface); border-radius:var(--radius); padding:22px; margin-top:16px;}
  .field{display:grid; gap:5px; margin-bottom:14px;}
  .field label{font-size:0.78rem; color:var(--muted); font-weight:500;}
  input, textarea{
    font:inherit; font-size:0.92rem; color:var(--text); background:#161826;
    border:1px solid var(--line); border-radius:8px; padding:9px 11px; width:100%;
  }
  .btn{font:inherit; font-size:0.9rem; font-weight:600; border-radius:9px; border:none; padding:10px 18px; cursor:pointer;}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-ghost{background:none; border:1px solid var(--line); color:var(--text);}
  .btn-danger{background:none; border:1px solid #c0392b; color:#e57368;}
  .btn-block{width:100%;}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .list-item{
    display:flex; justify-content:space-between; align-items:center; padding:14px 16px;
    background:var(--surface); border-radius:var(--radius); margin-top:10px; cursor:pointer;
  }
  .list-item:hover{background:var(--surface-2);}
  .badge{font-size:0.72rem; padding:3px 9px; border-radius:99px; font-weight:600;}
  .badge.pub{background:rgba(34,197,94,0.15); color:#4ade80;}
  .badge.draft{background:rgba(233,233,237,0.1); color:var(--muted);}
  .swatch.on{border-color:#fff !important;}
  .link-card{border:1px dashed var(--line); border-radius:9px; padding:14px; margin-bottom:10px; position:relative;}
  .link-card .remove{position:absolute; top:8px; right:8px; background:none; border:none; color:var(--muted); font-size:1.1rem; cursor:pointer;}
  .err{color:#e57368; font-size:0.85rem; margin-top:10px;}
  .file-status{font-size:0.8rem; color:var(--muted);}
</style>
</head>
<body>

<section id="s-login" class="wrap" style="max-width:360px; margin-top:100px;">
  <h1>Business Hub — Admin</h1>
  <div class="card">
    <div class="field"><label>Passwort</label><input type="password" id="li-pw"></div>
    <button class="btn btn-primary btn-block" id="do-login">Anmelden</button>
    <div class="err" id="login-err"></div>
  </div>
</section>

<div id="s-app" class="wrap hide">
  <div class="row" style="justify-content:space-between;">
    <h1>Business-Hub-Seiten</h1>
    <button class="btn btn-ghost" id="backToList">← Zur Liste</button>
  </div>

  <div id="p-list">
    <div id="pageList"></div>
  </div>

  <div id="p-edit" class="hide">
    <div class="card">
      <h2>Details</h2>
      <div class="field"><label>Firmenname</label><input type="text" id="e-name"></div>
      <div class="field"><label>Kontakt-E-Mail</label><input type="text" id="e-email"></div>
      <div class="field"><label>Telefon</label><input type="text" id="e-phone"></div>
      <div class="field"><label>Gewünschte Kartenanzahl</label>
        <select id="e-qty"><option value="10">10 Stk</option><option value="20">20 Stk</option><option value="50">50 Stk</option><option value="100">100 Stk</option></select>
      </div>
      <div class="field">
        <label>Hintergrundfarbe</label>
        <div class="row" id="e-swatches"></div>
      </div>
    </div>

    <div class="card">
      <h2>Status</h2>
      <p id="e-status" style="font-size:0.9rem; color:var(--muted); margin:0 0 14px;"></p>
      <button class="btn btn-primary" id="sendPreviewBtn">Vorschau an Kunden senden</button>
      <button class="btn btn-ghost" id="markPaidBtn" style="margin-top:8px;">Als bezahlt markieren</button>
    </div>

    <div class="card">
      <h2>Logo & Banner</h2>
      <div class="row" style="margin-bottom:14px;">
        <label class="btn btn-ghost">Logo hochladen<input type="file" id="e-logo" accept="image/*" hidden></label>
        <span class="file-status" id="e-logo-status">kein Logo</span>
      </div>
      <div class="row">
        <label class="btn btn-ghost">Banner hochladen<input type="file" id="e-banner" accept="image/*" hidden></label>
        <span class="file-status" id="e-banner-status">kein Banner</span>
      </div>
    </div>

    <div class="card">
      <h2>Links</h2>
      <div id="e-links"></div>
      <button type="button" class="btn btn-ghost" id="e-addLink" style="margin-top:6px;">+ Link hinzufügen</button>
    </div>

    <div class="row" style="margin-top:20px;">
      <button class="btn btn-primary" id="saveBtn">Speichern</button>
      <button class="btn btn-ghost" id="publishBtn"></button>
      <a class="btn btn-ghost" id="previewLink" target="_blank">Vorschau öffnen</a>
      <button class="btn btn-danger" id="deleteBtn">Löschen</button>
    </div>
    <div class="err" id="edit-err"></div>
    <span id="saveMsg" style="font-size:0.85rem; color:var(--muted);"></span>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const COLORS = ['#161826', '#6366f1', '#0e7490', '#16a34a', '#d1512d'];
  let currentPage = null;

  async function api(path, opts = {}) {
    const res = await fetch(path, { headers: opts.body instanceof FormData ? {} : { 'Content-Type': 'application/json' }, ...opts });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Fehler ' + res.status);
    return data;
  }

  $('do-login').onclick = async () => {
    try {
      await api('/api/hub/admin/login', { method: 'POST', body: JSON.stringify({ password: $('li-pw').value }) });
      boot();
    } catch (e) { $('login-err').textContent = e.message; }
  };

  async function boot() {
    $('s-login').classList.add('hide');
    $('s-app').classList.remove('hide');
    showList();
  }

  async function showList() {
    $('p-edit').classList.add('hide');
    $('p-list').classList.remove('hide');
    try {
      const { pages } = await api('/api/hub/admin/list');
      $('pageList').innerHTML = pages.map(p => `
        <div class="list-item" data-id="${p.id}">
          <div>
            <strong>${escapeHtml(p.business_name)}</strong>
            <div style="font-size:0.8rem; color:var(--muted);">/hub/${escapeHtml(p.slug)}</div>
          </div>
          <span class="badge ${p.published ? 'pub' : 'draft'}">${p.published ? 'Veröffentlicht' : 'Entwurf'}</span>
        </div>
      `).join('') || '<p style="color:var(--muted);">Noch keine Bestellungen.</p>';
      document.querySelectorAll('.list-item').forEach(el => el.onclick = () => openPage(el.dataset.id));
    } catch (e) { alert(e.message); }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  async function openPage(id) {
    try {
      const { page, links } = await api('/api/hub/admin/page/' + id);
      currentPage = page;
      $('p-list').classList.add('hide');
      $('p-edit').classList.remove('hide');
      $('e-name').value = page.business_name || '';
      $('e-email').value = page.contact_email || '';
      $('e-phone').value = page.contact_phone || '';
      $('e-qty').value = page.card_quantity || 10;
      $('e-status').textContent = page.paid
        ? '✓ Bezahlt (bitte in Stripe geprüft?) — jetzt veröffentlichen, wenn alles passt.'
        : page.ready_for_review
          ? 'Vorschau wurde an den Kunden geschickt, wartet auf Rückmeldung.'
          : 'Noch nicht an den Kunden geschickt.';
      $('e-logo-status').textContent = page.logo_key ? 'Logo gesetzt' : 'kein Logo';
      $('e-banner-status').textContent = page.banner_key ? 'Banner gesetzt' : 'kein Banner';
      $('e-swatches').innerHTML = COLORS.map(c => `<div class="swatch ${c === page.bg_color ? 'on' : ''}" data-c="${c}" style="width:28px;height:28px;border-radius:50%;cursor:pointer;background:${c};border:2px solid transparent;"></div>`).join('');
      document.querySelectorAll('#e-swatches .swatch').forEach(s => s.onclick = () => {
        document.querySelectorAll('#e-swatches .swatch').forEach(x => x.classList.remove('on'));
        s.classList.add('on');
      });
      $('e-links').innerHTML = '';
      (links.length ? links : [{}]).forEach(addLinkRow);
      $('publishBtn').textContent = page.published ? 'Depublizieren' : 'Veröffentlichen';
      $('previewLink').href = '/hub/' + page.slug;
      $('edit-err').textContent = '';
    } catch (e) { alert(e.message); }
  }

  function addLinkRow(values) {
    const div = document.createElement('div');
    div.className = 'link-card';
    div.innerHTML = `
      <button type="button" class="remove">×</button>
      <div class="field"><label>Beschreibung</label><input type="text" class="l-desc" value="${escapeHtml(values && values.description || '')}"></div>
      <div class="field"><label>Button-Text</label><input type="text" class="l-label" value="${escapeHtml(values && values.label || '')}"></div>
      <div class="field"><label>Ziel-Adresse</label><input type="text" class="l-url" value="${escapeHtml(values && values.url || '')}"></div>
    `;
    div.querySelector('.remove').onclick = () => div.remove();
    $('e-links').appendChild(div);
  }
  $('e-addLink').onclick = () => addLinkRow();

  function resizeImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        let w = img.width, h = img.height;
        if (w > h && w > maxDim) { h = Math.round(h * (maxDim / w)); w = maxDim; }
        else if (h > maxDim) { w = Math.round(w * (maxDim / h)); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => blob ? resolve(new File([blob], 'img.jpg', { type: 'image/jpeg' })) : reject(new Error('Bild konnte nicht verarbeitet werden')), 'image/jpeg', quality);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Bild konnte nicht gelesen werden')); };
      img.src = url;
    });
  }

  async function wireUpload(inputId, statusId, kind) {
    $(inputId).onchange = async e => {
      const f0 = e.target.files[0]; if (!f0 || !currentPage) return;
      $(statusId).textContent = 'Lädt hoch …';
      try {
        const f = await resizeImage(f0, kind === 'logo' ? 300 : 1200, 0.85);
        const fd = new FormData(); fd.append('file', f);
        await api(`/api/hub/admin/page/${currentPage.id}/${kind}`, { method: 'POST', body: fd });
        $(statusId).textContent = kind === 'logo' ? 'Logo gesetzt' : 'Banner gesetzt';
      } catch (err) { $(statusId).textContent = err.message; }
    };
  }
  wireUpload('e-logo', 'e-logo-status', 'logo');
  wireUpload('e-banner', 'e-banner-status', 'banner');

  $('saveBtn').onclick = async () => {
    if (!currentPage) return;
    const links = Array.from(document.querySelectorAll('#e-links .link-card')).map(c => ({
      description: c.querySelector('.l-desc').value.trim(),
      label: c.querySelector('.l-label').value.trim(),
      url: c.querySelector('.l-url').value.trim()
    })).filter(l => l.label && l.url);
    const swatch = document.querySelector('#e-swatches .swatch.on') || document.querySelector('#e-swatches .swatch');
    try {
      await api('/api/hub/admin/page/' + currentPage.id, {
        method: 'PUT',
        body: JSON.stringify({
          business_name: $('e-name').value.trim(),
          contact_email: $('e-email').value.trim(),
          contact_phone: $('e-phone').value.trim(),
          bg_color: swatch ? swatch.dataset.c : currentPage.bg_color,
          card_quantity: parseInt($('e-qty').value),
          links
        })
      });
      $('saveMsg').textContent = 'Gespeichert.';
      setTimeout(() => $('saveMsg').textContent = '', 2000);
    } catch (e) { $('edit-err').textContent = e.message; }
  };

  $('publishBtn').onclick = async () => {
    if (!currentPage) return;
    const willPublish = $('publishBtn').textContent === 'Veröffentlichen';
    try {
      await api(`/api/hub/admin/page/${currentPage.id}/${willPublish ? 'publish' : 'unpublish'}`, { method: 'POST' });
      currentPage.published = willPublish ? 1 : 0;
      $('publishBtn').textContent = willPublish ? 'Depublizieren' : 'Veröffentlichen';
    } catch (e) { $('edit-err').textContent = e.message; }
  };

  $('sendPreviewBtn').onclick = async () => {
    if (!currentPage) return;
    try {
      await api(`/api/hub/admin/page/${currentPage.id}/ready`, { method: 'POST' });
      $('e-status').textContent = 'Vorschau wurde an den Kunden geschickt, wartet auf Rückmeldung.';
      $('saveMsg').textContent = 'Vorschau-Link verschickt.';
      setTimeout(() => $('saveMsg').textContent = '', 2500);
    } catch (e) { $('edit-err').textContent = e.message; }
  };

  $('markPaidBtn').onclick = async () => {
    if (!currentPage) return;
    if (!confirm('Zahlungseingang bei Stripe wirklich geprüft und bestätigt?')) return;
    try {
      await api(`/api/hub/admin/page/${currentPage.id}/mark-paid`, { method: 'POST' });
      currentPage.paid = 1;
      $('e-status').textContent = '✓ Bezahlt — jetzt veröffentlichen, wenn alles passt.';
    } catch (e) { $('edit-err').textContent = e.message; }
  };

  $('deleteBtn').onclick = async () => {
    if (!currentPage || !confirm('Diese Seite wirklich löschen? Das kann nicht rückgängig gemacht werden.')) return;
    try {
      await api('/api/hub/admin/page/' + currentPage.id, { method: 'DELETE' });
      showList();
    } catch (e) { $('edit-err').textContent = e.message; }
  };

  $('backToList').onclick = showList;
</script>
</body>
</html>
