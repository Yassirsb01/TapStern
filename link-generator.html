<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link-Generator — Tapstern</title>
<link rel="icon" type="image/png" href="tapstern-favicon.png">
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=space-grotesk:600,700|inter:400,500,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafbfe; --card:#ffffff; --ink:#171923; --ink-soft:#5a6072;
    --primary:#4f46e5; --accent:#06b6d4; --line: rgba(23,25,35,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:'Inter',sans-serif; padding:32px 20px;
  }
  .wrap{max-width:460px; margin:0 auto;}
  h1{font-family:'Space Grotesk',sans-serif; font-size:1.5rem; font-weight:600; margin:0 0 6px;}
  p.sub{color:var(--ink-soft); font-size:0.92rem; margin:0 0 28px;}
  label{
    display:block; font-size:0.85rem; font-weight:600; margin:18px 0 6px;
  }
  label .hint{font-weight:400; color:var(--ink-soft); font-size:0.8rem;}
  input{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    font-size:0.95rem; font-family:'Inter',sans-serif; background:var(--card); color:var(--ink);
  }
  input:focus{outline:2px solid var(--primary); outline-offset:1px;}
  button{
    width:100%; margin-top:26px; padding:14px; border-radius:12px; border:none;
    background:var(--primary); color:#fff; font-size:1rem; font-weight:600;
    font-family:'Inter',sans-serif; cursor:pointer;
  }
  button:hover{background:#4338ca;}
  .result{
    margin-top:24px; background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:16px; display:none;
  }
  .result.show{display:block;}
  .result-label{font-size:0.78rem; color:var(--ink-soft); margin-bottom:6px;}
  .result-url{
    font-family:monospace; font-size:0.8rem; word-break:break-all; color:var(--primary);
    background:var(--bg); padding:10px; border-radius:8px; border:1px dashed var(--line);
  }
  .copy-btn{
    margin-top:12px; width:100%; padding:11px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); font-weight:600; font-size:0.9rem; cursor:pointer;
  }
  .copy-btn.copied{background:#dcfce7; border-color:#86efac; color:#166534;}
  .error{color:#dc2626; font-size:0.85rem; margin-top:6px; display:none;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>Link-Generator</h1>
    <p class="sub">Erstellt automatisch den fertigen Link für die Danke-Seite — kein manuelles Kodieren nötig.</p>

    <label for="name">Name des Ladens</label>
    <input id="name" placeholder="z. B. Mia Nails" />

    <label for="review">Google-Bewertungslink <span class="hint">(ganze URL)</span></label>
    <input id="review" placeholder="https://search.google.com/local/writereview?placeid=..." />

    <label for="discount">Dankeschön-Text <span class="hint">(optional)</span></label>
    <input id="discount" placeholder="z. B. Zeig diese Seite und bekomm 10% Rabatt" />

    <label for="code">Rabatt-Code <span class="hint">(optional)</span></label>
    <input id="code" placeholder="z. B. DANKE10" />

    <div class="error" id="error">Bitte mindestens Name und Google-Bewertungslink ausfüllen.</div>

    <button onclick="generateLink()">Link generieren</button>

    <div class="result" id="result">
      <div class="result-label">Fertiger Link für die NFC-Karte:</div>
      <div class="result-url" id="resultUrl"></div>
      <button class="copy-btn" id="copyBtn" onclick="copyLink()">Link kopieren</button>
    </div>
  </div>

<script>
  function generateLink() {
    const name = document.getElementById('name').value.trim();
    let review = document.getElementById('review').value.trim();
    if (review && !/^https?:\/\//i.test(review)) {
      review = 'https://' + review;
    }
    const discount = document.getElementById('discount').value.trim();
    const code = document.getElementById('code').value.trim();
    const errorEl = document.getElementById('error');
    const resultEl = document.getElementById('result');

    if (!name || !review) {
      errorEl.style.display = 'block';
      resultEl.classList.remove('show');
      return;
    }
    errorEl.style.display = 'none';

    let url = 'https://tapstern.de/danke.html?name=' + encodeURIComponent(name)
      + '&review=' + encodeURIComponent(review);

    if (discount) url += '&discount=' + encodeURIComponent(discount);
    if (code) url += '&code=' + encodeURIComponent(code);

    document.getElementById('resultUrl').textContent = url;
    resultEl.classList.add('show');
    document.getElementById('copyBtn').textContent = 'Link kopieren';
    document.getElementById('copyBtn').classList.remove('copied');
  }

  function copyLink() {
    const url = document.getElementById('resultUrl').textContent;
    navigator.clipboard.writeText(url).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Kopiert ✓';
      btn.classList.add('copied');
    });
  }
</script>
</body>
</html>
