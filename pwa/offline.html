<!DOCTYPE html>
<html lang="de">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tapstempel — offline</title>
<style>
  body{margin:0; min-height:100vh; display:grid; place-items:center; background:#f5f1e8; color:#111114; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; padding:24px; box-sizing:border-box; text-align:center;}
  img{width:84px; height:84px; border-radius:20px; margin-bottom:18px;}
  h1{font-size:22px; margin:0 0 8px;}
  p{margin:0 0 20px; color:#6b665e; line-height:1.5;}
  button{border:0; border-radius:100px; padding:12px 22px; font-size:15px; font-weight:600; background:#e5543d; color:#fff;}
</style>
</head>
<body>
  <div>
    <img src="/pwa/tapstempel-192.png" alt="">
    <h1>Keine Internetverbindung</h1>

    <button onclick="location.reload()">Erneut versuchen</button>
  </div>
</body>
</html>
