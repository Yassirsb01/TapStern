<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Tapstempel — Admin</title>
<style>
  :root{ --bg:#161826; --surface:#232532; --surface-2:#2b2d3c; --text:#e9e9ed; --accent:#9184d9;
         --accent-300:#b5abfc; --line:rgba(233,233,237,0.12); --muted:rgba(233,233,237,0.55); --radius:10px; }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; font-size:15px;}
  .hide{display:none !important;}
  .wrap{max-width:1000px; margin:0 auto; padding:32px 20px 80px;}
  h1{font-size:1.4rem; margin:0 0 4px;}
  a{color:var(--accent-300);}
  .card{background:var(--surface); border-radius:var(--radius); padding:22px; margin-top:16px;}
  .field{display:grid; gap:5px; margin-bottom:14px;}
  .field label{font-size:0.78rem; color:var(--muted); font-weight:500;}
  input{
    font:inherit; font-size:0.92rem; color:var(--text); background:#161826;
    border:1px solid var(--line); border-radius:8px; padding:9px 11px; width:100%;
  }
  .btn{font:inherit; font-size:0.84rem; font-weight:600; border-radius:9px; border:none; padding:8px 14px; cursor:pointer;}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-ghost{background:none; border:1px solid var(--line); color:var(--text);}
  .btn-ok{background:rgba(34,197,94,0.16); color:#4ade80; border:1px solid rgba(34,197,94,0.35);}
  .btn-danger{background:none; border:1px solid #c0392b; color:#e57368;}
  .btn-block{width:100%; padding:10px 18px; font-size:0.9rem;}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .err{color:#e57368; font-size:0.85rem; margin-top:10px;}
  .muted{color:var(--muted);}

  .stats{display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:10px; margin:20px 0 14px;}
  .stat{background:var(--surface); border-radius:var(--radius); padding:12px 14px; cursor:pointer; border:1px solid transparent;}
  .stat.on{border-color:var(--accent);}
  .stat small{display:block; color:var(--muted); font-size:0.75rem;}
  .stat strong{font-size:1.4rem;}

  .shop{background:var(--surface); border-radius:var(--radius); padding:16px 18px; margin-top:10px;}
  .shop-head{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:flex-start;}
  .shop-name{font-weight:700; font-size:1rem;}
  .shop-meta{font-size:0.82rem; color:var(--muted); margin-top:4px; line-height:1.5; overflow-wrap:anywhere;}
  .shop-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
  .note{font-size:0.82rem; margin-top:8px; padding:8px 10px; border-radius:8px; background:var(--surface-2); overflow-wrap:anywhere;}

  .badge{font-size:0.72rem; padding:3px 9px; border-radius:99px; font-weight:600; white-space:nowrap;}
  .b-trial{background:rgba(250,204,21,0.14); color:#facc15;}
  .b-subscribed{background:rgba(34,197,94,0.15); color:#4ade80;}
  .b-unlocked{background:rgba(96,165,250,0.16); color:#93c5fd;}
  .b-expired{background:rgba(233,233,237,0.1); color:var(--muted);}
  .b-locked{background:rgba(229,115,104,0.16); color:#e57368;}
  .b-unverified{background:rgba(233,233,237,0.06); color:var(--muted);}
</style>
</head>
<body>

<section id="s-login" class="wrap" style="max-width:360px; margin-top:100px;">
  <h1>Tapstempel — Admin</h1>
  <p class="muted" style="font-size:0.85rem; margin:4px 0 0;">Gleiches Passwort wie der Business-Hub-Admin.</p>
  <div class="card">
    <div class="field"><label for="li-pw">Passwort</label><input type="password" id="li-pw"></div>
    <button class="btn btn-primary btn-block" id="do-login">Anmelden</button>
    <div class="err" id="login-err"></div>
  </div>
</section>

<div id="s-app" class="wrap hide">
  <div class="row" style="justify-content:space-between;">
    <div>
      <h1>Stempel-Läden</h1>
      <div class="muted" style="font-size:0.85rem;">Zugang freischalten, sperren oder Testphase verlängern.</div>
    </div>
    <div class="row">
      <a class="btn btn-ghost" href="hub-admin.html" style="text-decoration:none;">Business Hub →</a>
      <button class="btn btn-ghost" id="reload">Aktualisieren</button>
    </div>
  </div>

  <div class="stats" id="stats"></div>
  <input type="search" id="search" placeholder="Suchen nach Name, E-Mail, Telefon …">
  <div id="shopList"></div>
  <div class="err" id="app-err"></div>
</div>

<script>
  const $ = id => document.getElementById(id);
  let shops = [];
  let filter = 'all';

  const STATES = {
    trial:      { label: 'Im Test',          cls: 'b-trial' },
    subscribed: { label: 'Abo aktiv',        cls: 'b-subscribed' },
    unlocked:   { label: 'Freigeschaltet',   cls: 'b-unlocked' },
    expired:    { label: 'Test abgelaufen',  cls: 'b-expired' },
    locked:     { label: 'Gesperrt',         cls: 'b-locked' },
  };

  async function api(path, opts = {}) {
    const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.error || 'Fehler ' + res.status), { status: res.status });
    return data;
  }
  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function fmtDate(sec) {
    return new Date(sec * 1000).toLocaleString('de-DE', { day: 'numeric', month: 'numeric', year: '2-digit', hour: '2-digit', minute: '2-digit' });
  }
  function fmtLeft(sec) {
    const ms = sec * 1000 - Date.now();
    if (ms <= 0) return 'abgelaufen';
    const h = Math.floor(ms / 3600000);
    return h >= 48 ? `noch ${Math.floor(h / 24)} Tage` : h >= 1 ? `noch ${h} Std.` : `noch ${Math.max(1, Math.floor(ms / 60000))} Min.`;
  }

  $('do-login').onclick = async () => {
    try {
      await api('/api/hub/admin/login', { method: 'POST', body: JSON.stringify({ password: $('li-pw').value }) });
      boot();
    } catch (e) { $('login-err').textContent = e.message; }
  };
  $('li-pw').onkeydown = e => { if (e.key === 'Enter') $('do-login').click(); };
  $('reload').onclick = () => load();
  $('search').oninput = () => render();

  async function boot() {
    $('s-login').classList.add('hide');
    $('s-app').classList.remove('hide');
    await load();
  }

  async function load() {
    $('app-err').textContent = '';
    try {
      shops = (await api('/api/admin/stempel/shops')).shops;
      render();
    } catch (e) {
      if (e.status === 401) { $('s-app').classList.add('hide'); $('s-login').classList.remove('hide'); return; }
      $('app-err').textContent = e.message;
    }
  }

  function render() {
    const verified = shops.filter(s => s.verified);
    const count = st => verified.filter(s => s.access.state === st).length;
    const tiles = [['all', 'Alle', verified.length], ...Object.entries(STATES).map(([k, v]) => [k, v.label, count(k)]), ['unverified', 'Unbestätigt', shops.length - verified.length]];
    $('stats').innerHTML = tiles.map(([k, label, n]) =>
      `<div class="stat ${filter === k ? 'on' : ''}" data-filter="${k}"><small>${label}</small><strong>${n}</strong></div>`).join('');
    document.querySelectorAll('.stat').forEach(el => el.onclick = () => { filter = el.dataset.filter; render(); });

    const q = $('search').value.trim().toLowerCase();
    const list = shops.filter(s => {
      if (filter === 'unverified' ? s.verified : !s.verified) return false;
      if (filter !== 'all' && filter !== 'unverified' && s.access.state !== filter) return false;
      if (!q) return true;
      return [s.name, s.email, s.phone, s.first_name, s.last_name, s.slug, s.branche].some(v => String(v || '').toLowerCase().includes(q));
    });

    $('shopList').innerHTML = list.length ? list.map(shopHtml).join('') : '<p class="muted" style="margin-top:20px;">Keine Läden gefunden.</p>';
    document.querySelectorAll('[data-act]').forEach(btn => btn.onclick = () => act(btn.dataset.id, btn.dataset.act, btn.dataset.days));
  }

  function shopHtml(s) {
    const st = STATES[s.access.state] || STATES.trial;
    const badge = s.verified ? `<span class="badge ${st.cls}">${st.label}</span>` : '<span class="badge b-unverified">E-Mail nicht bestätigt</span>';
    const contact = [[s.first_name, s.last_name].filter(Boolean).join(' '), s.email, s.phone].filter(Boolean).map(escapeHtml).join(' · ');
    const plan = s.subscription_status === 'active'
      ? `Stripe-Abo: ${s.plan === 'premium' ? 'Premium' : 'Basic'} ${s.billing_interval === 'yearly' ? '(jährlich)' : '(monatlich)'}`
      : 'kein Stripe-Abo';
    const trial = s.subscription_status === 'active' ? ''
      : s.access.trialEndsAt ? ` · Test bis ${fmtDate(s.access.trialEndsAt)} (${fmtLeft(s.access.trialEndsAt)})` : ' · Test startet beim nächsten Aufruf';
    const id = escapeHtml(s.id);
    const override = s.override === 'unlocked' || s.override === 'locked';
    return `
      <div class="shop">
        <div class="shop-head">
          <div style="min-width:0;">
            <div class="shop-name">${escapeHtml(s.name)} <a href="/s/${encodeURIComponent(s.slug)}" target="_blank" rel="noopener" style="font-size:0.8rem; font-weight:500;">Karte ↗</a></div>
            <div class="shop-meta">${contact}</div>
            <div class="shop-meta">${escapeHtml(s.branche || 'keine Branche')} · ${s.customers} Kunden · registriert ${escapeHtml(String(s.created_at || '').slice(0, 10))}</div>
            <div class="shop-meta">${plan}${trial}${override ? ' · <strong>manuell ' + (s.override === 'locked' ? 'gesperrt' : 'freigeschaltet') + '</strong>' : ''}</div>
          </div>
          ${badge}
        </div>
        ${s.note ? `<div class="note">📝 ${escapeHtml(s.note)}</div>` : ''}
        <div class="shop-actions">
          ${s.override !== 'unlocked' ? `<button class="btn btn-ok" data-act="unlock" data-id="${id}">Freischalten</button>` : ''}
          ${s.override !== 'locked' ? `<button class="btn btn-danger" data-act="lock" data-id="${id}">Sperren</button>` : ''}
          ${override ? `<button class="btn btn-ghost" data-act="auto" data-id="${id}" title="Wieder nach Test/Abo entscheiden">Automatisch (Test/Abo)</button>` : ''}
          <button class="btn btn-ghost" data-act="extend" data-days="1" data-id="${id}">Test +1 Tag</button>
          <button class="btn btn-ghost" data-act="extend" data-days="7" data-id="${id}">Test +7 Tage</button>
          <button class="btn btn-ghost" data-act="note" data-id="${id}">Notiz</button>
        </div>
      </div>`;
  }

  async function act(id, action, days) {
    const s = shops.find(x => x.id === id);
    const body = { action };
    if (action === 'lock' && !confirm(`„${s.name}“ sperren?\n\nKarte, Link, Stempeln und Wallet werden sofort pausiert.`)) return;
    if (action === 'unlock' && !confirm(`„${s.name}“ dauerhaft freischalten — auch ohne Stripe-Abo?`)) return;
    if (action === 'extend') body.days = parseInt(days, 10);
    if (action === 'note') {
      const note = prompt('Notiz zu „' + s.name + '“ (nur für dich sichtbar):', s.note || '');
      if (note === null) return;
      body.action = s.override === 'unlocked' ? 'unlock' : s.override === 'locked' ? 'lock' : 'auto';
      body.note = note;
    }
    try {
      await api(`/api/admin/stempel/shops/${encodeURIComponent(id)}/access`, { method: 'POST', body: JSON.stringify(body) });
      await load();
    } catch (e) { alert(e.message); }
  }

  // Schon angemeldet? Dann direkt die Liste zeigen.
  (async () => {
    try { shops = (await api('/api/admin/stempel/shops')).shops; boot(); } catch (e) { /* Login zeigen */ }
  })();
</script>
</body>
</html>
